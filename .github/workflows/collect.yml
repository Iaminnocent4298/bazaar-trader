name: Collect Bazaar data

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (the minimum allowed)
  workflow_dispatch:         # adds a manual "Run workflow" button

permissions:
  contents: write            # lets the job commit to your repo

concurrency:
  group: collect             # never run two collectors at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python src/collect_once.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git commit -m "Add snapshot" || echo "Nothing to commit"
          git pull --rebase
          git push